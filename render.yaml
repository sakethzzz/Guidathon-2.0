services:
  - type: web
    name: guidathon
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MANUS_PROJECT_ID
        sync: false
      - key: MANUS_JWT_SECRET
        sync: false
      - key: MANUS_OAUTH_API_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: MANUS_API_URL
        sync: false
      - key: MANUS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MCP_SERVER_URL
        sync: false
      - key: MCP_SERVER_TOKEN
        sync: false
